name: Update playlist

on:
  schedule:
    - cron: "17 3 * * *"   # daily, 03:17 UTC (06:17 Baghdad / Riyadh)
  workflow_dispatch:
  push:
    paths: ["sources.json", "scripts/**", ".github/workflows/update.yml"]

permissions:
  contents: write

concurrency:
  group: update-playlist
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Import, clean, check streams, rebuild playlists
        run: python3 scripts/update_playlist.py --import --check --logos

      - name: Commit changes
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "No changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add channels.json playlist*.m3u
          git commit -m "Auto-update playlist ($(date -u +%F))"
          for i in 1 2 3; do
            git pull --rebase origin "${GITHUB_REF_NAME}" && git push && exit 0
            sleep $((i * 5))
          done
          exit 1
