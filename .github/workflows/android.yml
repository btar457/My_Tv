name: Build Android app

on:
  push:
    paths: ["android/**", ".github/workflows/android.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      # The runner image already ships the Android SDK (ANDROID_HOME).
      - name: Build APK
        working-directory: android
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Rename APK
        run: cp android/app/build/outputs/apk/release/app-release.apk MyTV.apk

      - uses: actions/upload-artifact@v4
        with:
          name: MyTV-apk
          path: MyTV.apk

      # A release gives a direct download link that works from the phone browser:
      # https://github.com/btar457/My_Tv/releases/latest/download/MyTV.apk
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: app-v1.0.${{ github.run_number }}
          name: My TV 1.0.${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          files: MyTV.apk
          body: |
            حمّل الملف **MyTV.apk** من الأسفل وثبّته على هاتفك (فعّل «التثبيت من مصادر غير معروفة» إذا طُلب منك).
