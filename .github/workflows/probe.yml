# Temporary: checks which public playlist URLs respond, from GitHub's network.
name: Probe sources

on:
  push:
    paths: [".github/workflows/probe.yml"]

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe
        run: |
          for u in \
            https://iptv-org.github.io/iptv/languages/ara.m3u \
            https://iptv-org.github.io/iptv/categories/sports.m3u \
            https://iptv-org.github.io/iptv/categories/movies.m3u \
            https://iptv-org.github.io/iptv/categories/series.m3u \
            https://iptv-org.github.io/iptv/categories/kids.m3u \
            https://iptv-org.github.io/iptv/categories/entertainment.m3u \
            https://raw.githubusercontent.com/Free-TV/IPTV/master/playlist.m3u8 \
            https://i.mjh.nz/SamsungTVPlus/all.m3u8 \
            https://i.mjh.nz/PlutoTV/all.m3u8 \
            https://i.mjh.nz/Plex/all.m3u8 ; do
            code=$(curl -sL -o /tmp/f -w '%{http_code}' --max-time 60 "$u")
            n=$(grep -c '#EXTINF' /tmp/f || true)
            echo "RESULT $code extinf=$n $u"
          done
          echo "--- Free-TV group-titles:"
          curl -sL --max-time 60 https://raw.githubusercontent.com/Free-TV/IPTV/master/playlist.m3u8 | grep -o 'group-title="[^"]*"' | sort | uniq -c | sort -rn | head -60
          echo "--- Free-TV sample:"
          curl -sL --max-time 60 https://raw.githubusercontent.com/Free-TV/IPTV/master/playlist.m3u8 | grep -i -A1 'arab\|egypt\|saudi\|qatar\|emirat' | head -20
          echo "--- Samsung group-titles:"
          curl -sL --max-time 60 https://i.mjh.nz/SamsungTVPlus/all.m3u8 | grep -o 'group-title="[^"]*"' | sort | uniq -c | sort -rn | head -15
