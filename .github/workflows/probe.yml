# Temporary: checks which public playlist URLs respond, from GitHub's network.
name: Probe sources

on:
  push:
    paths: [".github/workflows/probe.yml"]

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe
        run: |
          for u in \
            https://iptv-org.github.io/iptv/categories/xxx.m3u \
            https://iptv-org.github.io/iptv/index.nsfw.m3u \
            https://raw.githubusercontent.com/iptv-org/iptv/gh-pages/categories/xxx.m3u \
            https://iptv-org.github.io/iptv/index.category.m3u \
            https://iptv-org.github.io/iptv/languages/ara.m3u \
            https://iptv-org.github.io/api/categories.json ; do
            code=$(curl -sL -o /tmp/f -w '%{http_code}' --max-time 60 "$u")
            n=$(grep -c '#EXTINF' /tmp/f || true)
            echo "RESULT $code extinf=$n size=$(stat -c%s /tmp/f) $u"
          done
          echo "--- group-titles mentioning xxx/adult in index.category.m3u:"
          curl -sL --max-time 60 https://iptv-org.github.io/iptv/index.category.m3u | grep -o 'group-title="[^"]*"' | sort | uniq -c | sort -rn | head -40
          echo "--- categories.json ids:"
          curl -sL --max-time 60 https://iptv-org.github.io/api/categories.json | head -c 1500
